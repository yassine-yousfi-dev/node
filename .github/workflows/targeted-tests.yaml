name: Targeted Tests (from Coverage Map)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find latest universal map artifact from main
        id: find_map
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch || "main";

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "map-builder.yaml",
              branch: defaultBranch,
              status: "completed",
              per_page: 100
            });

            const run = runs.find((r) => r.conclusion === "success");
            if (!run) {
              core.warning(`No successful map-builder run found on ${defaultBranch}.`);
              core.setOutput("has_map", "false");
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });

            const mapArtifact = artifacts.find((a) => a.name === "universal-map" && !a.expired);
            if (!mapArtifact) {
              core.warning(`Run ${run.id} has no non-expired universal-map artifact.`);
              core.setOutput("has_map", "false");
              return;
            }

            core.notice(`Using universal-map from run ${run.id} on ${defaultBranch}.`);
            core.setOutput("has_map", "true");
            core.setOutput("run_id", String(run.id));

      - name: Download universal map artifact from main
        if: ${{ steps.find_map.outputs.has_map == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: universal-map
          path: maps
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_map.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install universal-coverage tool deps
        working-directory: tools/universal-coverage
        run: npm install

      - name: Select tests based on PR diff + map
        id: select_tests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { execSync } = require("child_process");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            // Save PR file list + patch to a temp file for our selector
            const prDiff = files.map(f => ({
              filename: f.filename,
              status: f.status,
              patch: f.patch || null
            }));
            fs.writeFileSync("pr_files.json", JSON.stringify(prDiff, null, 2));
            fs.writeFileSync("selected_tests.txt", "");

            const mapPath = "maps/universal_coverage_map.json";
            if (!fs.existsSync(mapPath)) {
              core.warning("No universal map artifact found from main. Recommend running full test suite.");
              core.setOutput("selected_count", "0");
              return;
            }

            // Run selector
            execSync(`node tools/universal-coverage/src/index.js select --map "${mapPath}" --pr "pr_files.json" --out "selected_tests.txt"`, { stdio: "inherit" });

            const selected = fs.readFileSync("selected_tests.txt", "utf8").trim();
            if (!selected) {
              core.warning("No impacted tests found (or missing mapping). Recommend safe fallback (full or smoke suite).");
              core.setOutput("selected_count", "0");
            } else {
              core.setOutput("selected_count", String(selected.split("\n").filter(Boolean).length));
            }

      - name: Comment selected tests on PR
        uses: actions/github-script@v7
        env:
          SELECTED_COUNT: ${{ steps.select_tests.outputs.selected_count }}
          MAP_RUN_ID: ${{ steps.find_map.outputs.run_id }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- targeted-tests-comment -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const selected = fs.existsSync("selected_tests.txt")
              ? fs.readFileSync("selected_tests.txt", "utf8").trim()
              : "";
            const count = Number(process.env.SELECTED_COUNT || "0");
            const mapRunId = process.env.MAP_RUN_ID || "unknown";

            let body = `${marker}\n## Targeted test selection\n`;
            body += `Map source: \`main\` workflow run \`${mapRunId}\`.\n\n`;
            if (!selected) {
              body += "No impacted tests found (or map unavailable). Use fallback suite.\n";
            } else {
              const lines = selected.split("\n").filter(Boolean);
              const maxCommentLines = 200;
              const shown = lines.slice(0, maxCommentLines);
              body += `Selected ${count} test(s):\n`;
              body += shown.map((t) => `- \`${t}\``).join("\n");
              if (lines.length > shown.length) {
                body += `\n- ... and ${lines.length - shown.length} more (see workflow artifact \`selected_tests\`)`;
              }
              body += "\n";
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((c) =>
              c.user?.type === "Bot" && typeof c.body === "string" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload selected tests list
        uses: actions/upload-artifact@v4
        with:
          name: selected_tests
          path: selected_tests.txt
          if-no-files-found: ignore
