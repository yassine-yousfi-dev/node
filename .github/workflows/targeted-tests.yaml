name: Targeted Tests (from Coverage Map)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install universal-coverage tool deps
        working-directory: tools/universal-coverage
        run: npm install

      - name: Fetch universal map branch
        run: |
          git fetch origin testpilot-map:testpilot-map
          ls -la testpilot-map/maps || true

      - name: Select tests based on PR diff + map
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            // Save PR file list + patch to a temp file for our selector
            const prDiff = files.map(f => ({
              filename: f.filename,
              status: f.status,
              patch: f.patch || null
            }));
            fs.writeFileSync("pr_files.json", JSON.stringify(prDiff, null, 2));

            // Load universal map from the dedicated branch
            const mapPath = path.join("testpilot-map", "maps", "universal_coverage_map.json");
            if (!fs.existsSync(mapPath)) {
              core.warning("No universal map found. Recommend running full test suite.");
              core.setOutput("selected_tests", "");
              return;
            }

            // Run selector
            const { execSync } = require("child_process");
            execSync(`node tools/universal-coverage/src/index.js select --map "${mapPath}" --pr "pr_files.json" --out "selected_tests.txt"`, { stdio: "inherit" });

            const selected = fs.readFileSync("selected_tests.txt", "utf8").trim();
            if (!selected) {
              core.warning("No impacted tests found (or missing mapping). Recommend safe fallback (full or smoke suite).");
            } else {
              core.notice(`Selected tests:\n${selected.split("\n").map(x => "• " + x).join("\n")}`);
            }

      - name: Upload selected tests list
        uses: actions/upload-artifact@v4
        with:
          name: selected_tests
          path: selected_tests.txt
