name: Build Universal Coverage Map

on:
  workflow_dispatch:
    inputs:
      coverage_format:
        description: 'jacoco, lcov, or c8'
        required: true
        default: 'c8'
      coverage_path:
        description: 'Path to coverage file (e.g. coverage/coverage-final.json, coverage/lcov.info, or target/site/jacoco/jacoco.xml)'
        required: true
        default: 'coverage/coverage-final.json'
      test_list_command:
        description: 'Command that prints one test id per line'
        required: true
        default: 'find test/parallel test/sequential -type f \( -name ''test-*.js'' -o -name ''test-*.mjs'' \) | sed -E ''s#^test/##; s#\.(mjs|js)$##'' | sort'
      test_run_command_template:
        description: 'Command template to run ONE test. Use {{TEST}} placeholder.'
        required: true
        default: 'rm -rf coverage/tmp coverage/coverage-final.json && mkdir -p coverage/tmp && NODE_V8_COVERAGE=coverage/tmp python3 tools/test.py --mode=release --type=coverage -j1 {{TEST}} && npx c8 report --reporter=json --report-dir=coverage --temp-directory=coverage/tmp'
      test_filter:
        description: 'Optional regex filter applied to discovered test ids before mapping'
        required: false
        default: ''
      max_tests:
        description: 'Maximum number of tests to map (safe default for manual runs)'
        required: false
        default: '2'
      build_command:
        description: 'Optional build/install step (e.g. npm ci / mvn -q -DskipTests package). For Node core, this should build with --coverage.'
        required: false
        default: 'make build-ci -j$(nproc) V=1 CONFIG_FLAGS="--coverage" && make coverage-build-js'
  schedule:
    - cron: '0 2 * * *' # nightly 02:00 UTC

permissions:
  contents: write

concurrency:
  group: map-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FORMAT: ${{ inputs.coverage_format || 'c8' }}
      COVERAGE_PATH: ${{ inputs.coverage_path || 'coverage/coverage-final.json' }}
      TEST_LIST_COMMAND: ${{ inputs.test_list_command || 'find test/parallel test/sequential -type f \( -name ''test-*.js'' -o -name ''test-*.mjs'' \) | sed -E ''s#^test/##; s#\.(mjs|js)$##'' | sort' }}
      TEST_RUN_TEMPLATE: ${{ inputs.test_run_command_template || 'rm -rf coverage/tmp coverage/coverage-final.json && mkdir -p coverage/tmp && NODE_V8_COVERAGE=coverage/tmp python3 tools/test.py --mode=release --type=coverage -j1 {{TEST}} && npx c8 report --reporter=json --report-dir=coverage --temp-directory=coverage/tmp' }}
      TEST_FILTER: ${{ inputs.test_filter || '' }}
      MAX_TESTS: ${{ inputs.max_tests || '2' }}
      BUILD_COMMAND: ${{ inputs.build_command || 'make build-ci -j$(nproc) V=1 CONFIG_FLAGS="--coverage" && make coverage-build-js' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache universal-coverage deps
        uses: actions/cache@v4
        with:
          path: tools/universal-coverage/node_modules
          key: ${{ runner.os }}-universal-coverage-${{ hashFiles('tools/universal-coverage/package.json') }}
          restore-keys: |
            ${{ runner.os }}-universal-coverage-

      - name: Install universal-coverage tool deps
        working-directory: tools/universal-coverage
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Optional build/install
        if: ${{ env.BUILD_COMMAND != '' }}
        run: ${{ env.BUILD_COMMAND }}

      - name: Generate universal map (per-test coverage)
        run: |
          EFFECTIVE_TEST_LIST_COMMAND="$TEST_LIST_COMMAND"
          if [ -n "$TEST_FILTER" ]; then
            EFFECTIVE_TEST_LIST_COMMAND="$EFFECTIVE_TEST_LIST_COMMAND | grep -E '$TEST_FILTER'"
          fi
          if [ -n "$MAX_TESTS" ]; then
            EFFECTIVE_TEST_LIST_COMMAND="$EFFECTIVE_TEST_LIST_COMMAND | head -n $MAX_TESTS"
          fi

          echo "Using test list command:"
          echo "$EFFECTIVE_TEST_LIST_COMMAND"

          node tools/universal-coverage/src/index.js map \
            --format "$COVERAGE_FORMAT" \
            --coverage "$COVERAGE_PATH" \
            --test-list "$EFFECTIVE_TEST_LIST_COMMAND" \
            --test-run "$TEST_RUN_TEMPLATE" \
            --out "maps/universal_coverage_map.json"

      - name: Commit map to branch testpilot-map
        run: |
          git config user.name "testpilot-bot"
          git config user.email "testpilot-bot@users.noreply.github.com"

          git checkout -B testpilot-map
          mkdir -p maps
          git add maps/universal_coverage_map.json

          git commit -m "Update universal coverage map" || echo "No changes"
          git push -f origin testpilot-map
